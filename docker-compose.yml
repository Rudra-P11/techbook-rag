version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: techbook_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api_and_ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: techbook_app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - DOCUMENT_STORAGE_DIR=/app/data/documents
      - EXTRACTED_TEXT_DIR=/app/data/extracted
      - REGISTRY_DB_URL=sqlite:////app/data/registry.db
    volumes:
      - ./Corpus:/app/Corpus
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped
